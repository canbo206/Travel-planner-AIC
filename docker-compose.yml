# Local Postgres for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roadtrip
      POSTGRES_PASSWORD: roadtrip
      POSTGRES_DB: roadtrip
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
